<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ページが見つかりません | 東三河支部</title>
<link rel="icon" href="images/logo.jpg" type="image/jpeg">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--red:#cc0000;--navy:#1a1a2e;--gray:#666;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans JP',sans-serif;color:#222;background:var(--navy);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;}
.wrap{max-width:480px;}
.logo{width:72px;height:72px;border-radius:12px;margin-bottom:24px;}
.code{font-size:15px;font-weight:900;letter-spacing:.2em;color:var(--red);margin-bottom:12px;}
h1{font-size:24px;font-weight:900;color:#fff;margin-bottom:16px;}
p{color:rgba(255,255,255,.75);font-size:14px;line-height:1.8;margin-bottom:32px;}
a.btn{display:inline-block;background:var(--red);color:#fff;font-weight:900;font-size:14px;padding:12px 32px;border-radius:50px;text-decoration:none;transition:all .2s;}
a.btn:hover{transform:translateY(-2px);}
a.btn:focus-visible{outline:3px solid #fff;outline-offset:2px;}
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="images/logo.jpg" alt="ASVF">
    <div class="code">404 NOT FOUND</div>
    <h1>お探しのページが見つかりません</h1>
    <p>URLが変更・削除されたか、入力に誤りがある可能性があります。<br>トップページから目的のページをお探しください。</p>
    <a class="btn" href="/">🏠 トップページへ戻る</a>
  </div>
</body>
</html>
